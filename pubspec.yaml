name: map_prototype_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  cupertino_icons: ^1.0.8
  flutter:
    sdk: flutter
  geolocator: ^14.0.2
  google_maps_flutter: ^2.17.0
  latlong2: ^0.9.1
  mapbox_maps_flutter: ^2.21.1

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:

  uses-material-design: true
  assets:
    - assets/mock/locations.geojson
    - assets/icons/
    - assets/map_styles/
    - assets/mock/zones.geojson
    - assets/mock/routes.geojson
